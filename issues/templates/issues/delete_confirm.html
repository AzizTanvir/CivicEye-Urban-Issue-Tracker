<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 card p-4 shadow">
            <h4 class="text-danger">Do you want to delete the report?</h4>
            <p>Are you sure that you delete <strong>"{{ report.title }}"</strong> report?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete Report</button>
                <a href="{% url 'my_reports' %}" class="btn btn-secondary">No, Go Back</a>
            </form>
        </div>
    </div>
</div>
