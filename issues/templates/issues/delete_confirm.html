<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 card p-4 shadow">
            <h4 class="text-danger">রিপোর্টটি ডিলিট করতে চান?</h4>
            <p>আপনি কি নিশ্চিত যে <strong>"{{ report.title }}"</strong> রিপোর্টটি ডিলিট করতে চান? এটি আর ফিরে পাওয়া যাবে না।</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">হ্যাঁ, ডিলিট করুন</button>
                <a href="{% url 'my_reports' %}" class="btn btn-secondary">না, ফিরে যাই</a>
            </form>
        </div>
    </div>
</div>
