<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports - CivicEye</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">CivicEye Dashboard</a>
            <a href="/" class="btn btn-outline-light btn-sm">ফিরে যান</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm p-4 border-0">
            <h3 class="mb-4 text-center">আমার করা রিপোর্টসমূহ</h3>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ছবি</th>
                            <th>শিরোনাম</th>
                            <th>ক্যাটাগরি</th>
                            <th>স্ট্যাটাস</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for report in reports %}
                        <tr>
                            <td>
                                {% if report.image %}
                                <img src="{{ report.image.url }}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                                {% endif %}
                            </td>
                            <td><strong>{{ report.title }}</strong></td>
                            <td>{{ report.category }}</td>
                            <td>
                                <span class="badge bg-primary">{{ report.status }}</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a href="{% url 'issue_detail' report.pk %}" class="btn btn-sm btn-info text-white">দেখুন</a>
                                    <form action="{% url 'delete_report' report.pk %}" method="POST" onsubmit="return confirm('ডিলিট করতে চান?')">
                                        {% csrf_token %}
                                        <button type="submit" class="btn btn-sm btn-danger">ডিলিট</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">আপনি এখনো কোনো রিপোর্ট করেননি।</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
